name: puter

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUTER_DIR: /data
      PUTER_TZ: ${PUTER_TZ:-America/New_York}
    volumes:
      - ${PUTER_HOME}/data:/data
      - ${PUTER_HOME}/state:/app/server/state
      - ${PUTER_HOME}/backups:/app/server/backups
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ${PUTER_HOME}/certs:/etc/nginx/certs:ro
    ports:
      - "${PUTER_BIND:?}:80:80"
      - "${PUTER_BIND:?}:443:443"