name: puter

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUTER_DIR: /data
      PUTER_TZ: ${PUTER_TZ:-America/New_York}
    volumes:
      - ${PUTER_HOME}/data:/data
      - ${PUTER_HOME}/state:/app/server/state
      - ${PUTER_HOME}/backups:/app/server/backups
    ports:
      - "0.0.0.0:3001:3001"
    healthcheck:
      test: ["CMD", "node", "server/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s